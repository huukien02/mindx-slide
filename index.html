<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mindx Slide</title>
    <script>
      // Áp dụng sáng/tối ngay từ đầu để không bị nháy màu: ưu tiên lựa chọn đã lưu, nếu chưa có thì theo hệ điều hành
      (function () {
        var t = null;
        try { t = localStorage.getItem('mxs.uiTheme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>
    <link rel="shortcut icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" sizes="256x256" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="fontLink"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- ================= TRANG CHỦ ================= -->
    <section id="screen-home" class="screen d-none">
      <nav class="home-nav">
        <div class="container d-flex align-items-center">
          <a class="brand" href="#/"
            ><img class="brand-logo" src="assets/favicon.svg" alt="MindX" /> MindX <b>Slide</b></a
          >
          <button class="btn btn-light border theme-toggle ms-auto" data-action="toggle-theme" title="Đổi giao diện sáng / tối"></button>
        </div>
      </nav>

      <main class="container pt-4 pb-5">
        <section id="demos" class="mb-5">
          <h2 class="section-title">Chọn mẫu để bắt đầu</h2>
          <div id="demoList" class="row g-4"></div>
        </section>
        <section>
          <h2 class="section-title">
            Bài của em
            <span id="deckCount" class="text-secondary fw-normal fs-6"></span>
          </h2>
          <div id="deckList" class="row g-4"></div>
        </section>
      </main>
    </section>

    <!-- ================= TRÌNH SOẠN THẢO ================= -->
    <section id="screen-editor" class="screen d-none">
      <header class="ed-header">
        <a href="#/" class="ed-logo" title="Về trang chủ"
          ><img src="assets/favicon.svg" alt="MindX"
        /></a>
        <div class="ed-title-wrap">
          <i class="bi bi-pencil-fill ed-title-pen"></i>
          <input
            id="deckTitle"
            class="ed-title"
            maxlength="120"
            title="Tên bài thuyết trình"
          />
          <span id="saveStatus" class="save-status"></span>
        </div>
        <div class="ed-actions">
          <button class="btn btn-light btn-sm border theme-toggle" data-action="toggle-theme" title="Đổi giao diện sáng / tối"></button>
          <button
            class="btn btn-light btn-sm border"
            data-bs-toggle="modal"
            data-bs-target="#designModal"
          >
            <i class="bi bi-palette-fill"></i>
            <span class="d-none d-sm-inline">Thiết kế</span>
          </button>
          <button id="btnHtml" class="btn btn-light btn-sm border" title="Tải file HTML để trình chiếu trên máy khác">
            <i class="bi bi-filetype-html"></i>
            <span class="d-none d-sm-inline">Xuất HTML</span>
          </button>
          <button id="btnPresent" class="btn btn-brand btn-sm">
            <i class="bi bi-play-fill"></i> Trình chiếu
          </button>
        </div>
      </header>

      <div class="workspace">
        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="col-head"><span class="step">1</span> Chọn slide</div>
          <div id="slideList" class="slide-list"></div>
          <div class="p-2 border-top">
            <button id="btnAdd" class="btn btn-primary w-100 btn-sm">
              <i class="bi bi-plus-lg"></i> Thêm slide
              <span id="slideCount" class="opacity-75"></span>
            </button>
          </div>
        </aside>

        <!-- Editor -->
        <section class="editor-panel">
          <div class="col-head">
            <span class="step">2</span>
            <span id="edSlideHead" class="text-truncate"></span>
          </div>
          <div class="ed-section">
            <div id="warnBox"></div>
            <div id="fieldForm"></div>
          </div>
        </section>

        <!-- Preview -->
        <section class="preview-panel">
          <div class="col-head">
            <span class="step">3</span> Xem trước
            <span class="pv-hint"
              ><i class="bi bi-hand-index-thumb"></i> Bấm vào chữ hoặc ảnh trên
              slide để sửa</span
            >
          </div>
          <div id="previewWrap" class="pv-wrap">
            <div id="previewBox" class="slide-fit pv-box"></div>
          </div>
          <div class="pv-nav">
            <button id="pvPrev" class="pv-btn" title="Slide trước">
              <i class="bi bi-chevron-left"></i>
            </button>
            <span id="pvCounter" class="pv-counter"></span>
            <button id="pvNext" class="pv-btn" title="Slide sau">
              <i class="bi bi-chevron-right"></i>
            </button>
            <button id="pvFull" class="pv-btn ms-2" title="Toàn màn hình">
              <i class="bi bi-arrows-fullscreen"></i>
            </button>
          </div>
        </section>
      </div>
    </section>

    <!-- ================= TRÌNH CHIẾU ================= -->
    <div id="presenter" class="presenter d-none">
      <div id="presStage" class="pres-stage">
        <div id="presFit" class="pres-fit"></div>
      </div>
      <div class="pres-ctl">
        <button id="presPrev" title="Slide trước (←)">
          <i class="bi bi-chevron-left"></i>
        </button>
        <span id="presCounter"></span>
        <button id="presNext" title="Slide sau (→ / Space)">
          <i class="bi bi-chevron-right"></i>
        </button>
        <button id="presExit" title="Thoát (Esc)">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal fade" id="addModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="bi bi-plus-square-fill text-primary"></i> Thêm slide mới
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <h6 class="fw-bold">
              Chọn nội dung cho slide mới (<span id="addTypeLabel"></span>)
            </h6>
            <div id="addCtGrid" class="add-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="designModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="bi bi-palette-fill text-primary"></i> Thiết kế
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <label class="form-label fw-semibold">Giao diện</label>
            <div id="themeGrid" class="theme-grid mb-4"></div>
            <label class="form-label fw-semibold">Màu chủ đạo</label>
            <div class="swatches mb-4">
              <div id="swatches" class="d-contents"></div>
              <input
                id="colorInput"
                type="color"
                class="swatch-picker"
                title="Chọn màu khác"
              />
            </div>
            <label class="form-label fw-semibold">Font chữ</label>
            <div id="fontList" class="font-list"></div>
          </div>
          <div class="modal-footer py-2">
            <span class="small text-secondary me-auto"
              >Áp dụng cho tất cả slide</span
            ><button
              type="button"
              class="btn btn-primary btn-sm"
              data-bs-dismiss="modal"
            >
              Xong
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="confirmBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              id="confirmCancel"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button type="button" class="btn btn-danger" id="confirmOk">
              Đồng ý
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      id="toasts"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data/themes.js"></script>
    <script src="js/data/layouts.js"></script>
    <script src="js/data/structures.js"></script>
    <script src="js/slide-styles.js"></script>
    <script src="js/render.js"></script>
    <script src="js/data/demos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/present.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
